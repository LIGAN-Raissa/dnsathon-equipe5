server:
    # --- 1. Écoute réseau & Concurrence ---
    verbosity: 1
    interface: 0.0.0.0
    port: 53
    do-ip4: yes
    do-ip6: yes
    do-udp: yes
    do-tcp: yes
    num-threads: 2

    # --- 2. Contrôle d'accès (Isolation) ---
    # Unbound n'accepte QUE les requêtes du réseau interne Docker (venant de DNSdist)
    access-control: 0.0.0.0/0 refuse
    access-control: 127.0.0.0/8 allow
    access-control: 10.0.0.0/8 allow
    access-control: 172.16.0.0/12 allow
    access-control: 192.168.0.0/16 allow

    # --- 3. Intégrité et Authenticité : DNSSEC ---
    # Validation cryptographique obligatoire le long de la chaîne de confiance
    auto-trust-anchor-file: "/opt/unbound/etc/unbound/var/root.key"
    val-clean-additional: yes
    val-permissive-mode: no

    # --- 4. Protection de la vie privée (Privacy) ---
    # QNAME Minimization (RFC 7816) : ne transmet que la partie stricte du domaine aux racines et TLDs
    qname-minimisation: yes
    # Masquage de l'identité et de la version logicielle (anti-reconnaissance)
    hide-identity: yes
    hide-version: yes

    # --- 5. Durcissement contre l'empoisonnement de cache (Cache Poisoning) ---
    # Randomisation de la casse (0x20 bit encoding)
    use-caps-for-id: yes
    # Ports sources imprévisibles
    outgoing-range: 8192
    outgoing-num-tcp: 128
    incoming-num-tcp: 128

    # --- 6. Protection anti-fragmentation & Amplification ---
    # 1232 octets = Recommandation DNS Flag Day pour éviter la fragmentation IP (exploits DDoS)
    edns-buffer-size: 1232
    max-udp-size: 1232

    # --- 7. Optimisation des performances du Cache ---
    msg-cache-size: 64m
    rrset-cache-size: 128m
    infra-cache-numhosts: 10000
    cache-min-ttl: 60
    cache-max-ttl: 86400
    prefetch: yes
    prefetch-key: yes
    # --- 8. Threat Intelligence / Blocage de sécurité ---
    include: "/opt/unbound/etc/unbound/blocklists/*.conf"
