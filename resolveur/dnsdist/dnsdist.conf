-- ====================================================================
-- DNSdist Configuration - Passerelle Sécurisée & Anti-DDoS
-- ====================================================================

-- 1. Configuration des interfaces d'écoute
-- Port 53 UDP et TCP : DNS Standard
setLocal("0.0.0.0:53", { reusePort=true })

-- Port 853 TCP : DNS-over-TLS (DoT)
addTLSLocal("0.0.0.0:853", "/etc/dnsdist/certs/server.crt", "/etc/dnsdist/certs/server.key")

-- Port 443 TCP : DNS-over-HTTPS (DoH)
-- Route standard : https://<ip_ou_domaine>/dns-query
addDOHLocal("0.0.0.0:443", "/etc/dnsdist/certs/server.crt", "/etc/dnsdist/certs/server.key", {"/dns-query"}, { reusePort=true })

-- Résolveur public : autoriser les requêtes de tous les réseaux (Internet)
addACL("0.0.0.0/0")
addACL("::/0")

-- 2. Console Web & Métriques Prometheus (pour le dashboard de démo)
webserver("0.0.0.0:8083")
setWebserverConfig({password="hackathon2026", apiKey="hackathon2026", statsRequireAuthentication=false, acl="0.0.0.0/0, ::/0"})

-- 3. Déclaration du Backend Récursif (Unbound)
newServer({
    address="172.28.0.2:53",
    name="unbound-backend",
    checkInterval=2,
    checkTimeout=1000,
    maxCheckFailures=3,
    mustResolve=false
})

-- 4. Protection Anti-DDoS & Règles de Sécurité
-- A. Blocage immédiat des requêtes de type ANY
addAction(QTypeRule(DNSQType.ANY), DropAction())

-- B. Rate limiting agressif par IP source contre les floods
addAction(MaxQPSIPRule(50, 32, 64), DelayAction(100)) -- Ralentit si > 50 requêtes/sec
addAction(MaxQPSIPRule(150, 32, 64), DropAction())    -- Rejette si > 150 requêtes/sec

-- C. Dynamic Blocking contre les attaques de force brute / spam
local dbr = dynBlockRulesGroup()
dbr:setQueryRate(100, 10, "Exceeded query rate limit", 60)
dbr:setRCodeRate(DNSRCode.SERVFAIL, 20, 10, "Exceeded SERVFAIL rate limit", 60)

function maintenance()
    dbr:apply()
end
