server:
    # --- Écoute réseau et concurrence ---
    verbosity: 1
    interface: 0.0.0.0
    port: 53
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes
    num-threads: 2
    username: "unbound"
    chroot: ""
    pidfile: "/var/run/unbound/unbound.pid"

    # --- Contrôle d'accès : IXP + LAN du lab -------------------------------
    access-control: 0.0.0.0/0 refuse
    access-control: 127.0.0.0/8 allow
    access-control: 10.0.0.0/8 allow
    access-control: 172.16.0.0/12 allow
    access-control: 192.168.0.0/16 allow

    # --- DNSSEC : validation stricte ---------------------------------------
    auto-trust-anchor-file: "/var/lib/unbound/root.key"
    val-clean-additional: yes
    val-permissive-mode: no

    # --- Vie privée et durcissement ----------------------------------------
    qname-minimisation: yes
    hide-identity: yes
    hide-version: yes
    use-caps-for-id: yes
    outgoing-range: 8192
    outgoing-num-tcp: 128
    incoming-num-tcp: 128

    # --- Anti-fragmentation / anti-amplification ---------------------------
    edns-buffer-size: 1232
    max-udp-size: 1232

    # --- Cache -------------------------------------------------------------
    msg-cache-size: 64m
    rrset-cache-size: 128m
    infra-cache-numhosts: 10000
    cache-min-ttl: 60
    cache-max-ttl: 86400
    prefetch: yes
    prefetch-key: yes

    # --- Zone locale de démonstration --------------------------------------
    local-zone: "dnsathon.local." static
    local-data: "resolver.dnsathon.local. IN A 10.53.0.53"
    local-data: "www.dnsathon.local. IN A 10.53.0.53"

    # --- Threat intelligence (fichier fourni par l'équipe résolveur) -------
    include: "/etc/unbound/blocklists/*.conf"
